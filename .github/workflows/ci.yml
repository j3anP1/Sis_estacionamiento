name: CI Pipeline - Sistema de Estacionamiento

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obtener código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 3. Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: 4. Compilar proyecto y ejecutar pruebas
        run: ./mvnw clean test